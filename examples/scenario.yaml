protocol: http

# POSTs a random JSON payload on every request: a fresh UUID, random numbers, strings,
# booleans and a pick from a list. Point `url` at the service you want to load (the http-sink target is kept below).
load:
  stages:
    - { duration: 10s, rate: 20, workers: 5 }
    - { duration: 30s, rate: 100, workers: 20 }
    - { duration: 10s, rate: 0, workers: 0 }

http:
  timeout: 5s
  targets:
    - name: sink
      method: POST
      url: https://http-sink.jecklgamis.com/sink
      headers:
        Content-Type: application/json
        Accept: application/json
      body: |
        {
          "id": "{{ uuid }}",
          "user": "{{ .Feeder.user }}",
          "sku": "{{ randString 8 }}",
          "quantity": {{ randInt 1 10 }},
          "price": {{ randFloat 1 500 }},
          "priority": "{{ randChoice "low" "normal" "high" }}",
          "gift": {{ randBool }},
          "note": "{{ randString 24 }}"
        }
      expect_status: [200, 201, 202]
  feeder:
    mode: random
    rows:
      - { user: alice }
      - { user: bob }
      - { user: carol }

assertions:
  - metric: success_rate
    min: "0.99"
  - metric: latency_p95
    max: 500ms
