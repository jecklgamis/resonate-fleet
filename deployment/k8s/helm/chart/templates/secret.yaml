{{- if not .Values.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "resonate-worker.fullname" . }}
  labels:
    {{- include "resonate-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_TOKEN: {{ .Values.apiToken | quote }}
  {{- if .Values.controller.token }}
  CONTROLLER_TOKEN: {{ .Values.controller.token | quote }}
  {{- end }}
  {{- if .Values.scenarioSourceToken }}
  SCENARIO_SOURCE_TOKEN: {{ .Values.scenarioSourceToken | quote }}
  {{- end }}
{{- end }}
