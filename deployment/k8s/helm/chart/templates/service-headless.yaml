{{- if .Values.headlessService.enabled }}
# Headless Service for resonate-fleet's DNS discovery: its DNS name resolves to
# one address per ready pod, so the fleet command can address each worker
# individually. (The regular Service load-balances, which would scatter a task's
# polls across pods.)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "resonate-worker.fullname" . }}-headless
  labels:
    {{- include "resonate-worker.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: 58080
      targetPort: 58080
      protocol: TCP
      name: http
  selector:
    {{- include "resonate-worker.selectorLabels" . | nindent 4 }}
{{- end }}
