{{- if not .Values.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "resonate-controller.fullname" . }}
  labels:
    {{- include "resonate-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  CONTROLLER_TOKEN: {{ .Values.controllerToken | quote }}
{{- end }}
