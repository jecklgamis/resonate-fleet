apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resonate-worker.fullname" . }}
  labels:
    {{- include "resonate-worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "resonate-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "resonate-worker.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "resonate-worker.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "resonate-worker.secretName" . }}
                  key: API_TOKEN
            {{- if .Values.controller.url }}
            - name: CONTROLLER_URL
              value: {{ .Values.controller.url | quote }}
            - name: CONTROLLER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "resonate-worker.secretName" . }}
                  key: CONTROLLER_TOKEN
                  optional: true
            - name: WORKER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.controller.advertiseUrl }}
            - name: ADVERTISE_URL
              value: {{ .Values.controller.advertiseUrl | quote }}
            {{- end }}
            {{- if .Values.controller.labels }}
            - name: WORKER_LABELS
              value: {{ range $k, $v := .Values.controller.labels }}{{ $k }}={{ $v }},{{ end }}
            {{- end }}
            {{- end }}
            {{- if .Values.s3.bucket }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_PREFIX
              value: {{ .Values.s3.prefix | quote }}
            {{- if .Values.s3.endpoint }}
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.scenarioSources }}
            - name: SCENARIO_SOURCES
              value: {{ join "," .Values.scenarioSources | quote }}
            - name: SCENARIO_SOURCE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "resonate-worker.secretName" . }}
                  key: SCENARIO_SOURCE_TOKEN
                  optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: 58080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/workspace
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "resonate-worker.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
