# Default values for resonate-worker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# resonate-worker keeps task state and task workspaces on local disk - nothing is
# shared across replicas, so a client's poll of GET /task/{id} through the Service
# can land on a pod that never ran it. Keep replicaCount (and autoscaling) at 1
# unless the workers register with a controller (controller.url below): then each
# pod registers by itself and the controller talks to it directly, so any number
# works.
replicaCount: 1

image:
  repository: jecklgamis/resonate-worker
  # image.tag defaults to a mutable tag ("main"), so IfNotPresent would let a
  # node keep serving a stale cached image after a new push under the same
  # tag - use a pinned/immutable tag (e.g. a commit SHA) if you want to go
  # back to IfNotPresent.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "main"

# jecklgamis/resonate-worker is a public image; only set this if you're
# pointing image.repository at a private registry/fork.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# API_TOKEN gates every /task* endpoint (Authorization: Bearer <apiToken>);
# /healthz stays open either way, for the liveness/readiness probes below.
# Defaults to "default" so this works out of the box, but should be
# overridden for anything beyond a quick trial. Set existingSecretName
# instead to source it from a Secret you manage yourself (must contain a
# data/stringData key named API_TOKEN) without putting it in values.yaml/git.
apiToken: "default"
existingSecretName: ""

# Where the worker may fetch scenarios from when one is submitted by URL
# ({"scenarioUrl": ...}). Empty means URL submissions are refused. Each entry is
# http(s)://host[:port][/path-prefix]; keep them narrow. scenarioSourceToken, if
# set, is sent as a bearer token on every fetch (it goes in the same Secret as
# apiToken; with existingSecretName, add a SCENARIO_SOURCE_TOKEN key to yours).
scenarioSources: []
#  - https://config.example.com/scenarios
scenarioSourceToken: ""

# Register with a resonate-controller (see docs/controller.md). Empty url
# disables it. The worker finds its own pod address unless advertiseUrl is set.
# token goes in the same Secret as apiToken (with existingSecretName, add a
# CONTROLLER_TOKEN key to yours). labels, e.g. {region: sgp1}, select workers.
controller:
  url: ""
  token: ""
  advertiseUrl: ""
  labels: {}

# Upload each finished task's files (scenario, data files, reports, results, log)
# to s3://<bucket>/<prefix>/<taskId>/. Empty bucket disables it. Credentials come
# from the standard AWS chain; on EKS, annotate the service account below with an
# IAM role (IRSA). endpoint is for S3-compatible services such as MinIO.
s3:
  bucket: ""
  prefix: ""
  endpoint: ""

# Push live request metrics (requests, errors, latency histogram) over OTLP/HTTP
# while a task runs - see docs/metrics.md. Empty endpoint disables it. Point it at
# an OpenTelemetry Collector, e.g. http://otel-collector.monitoring.svc:4318.
# exportInterval is in milliseconds (the SDK's own default is 60000; the worker
# uses 10000 when this is empty).
otel:
  endpoint: ""
  exportInterval: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # Set fsGroup if persistence.enabled and the volume needs to be writable by
  # the container's non-root "app" user (see deployment/docker/worker/Dockerfile) on first mount.
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/issuer: "letsencrypt-prod"
    # A scenario file is small, but a submitted report/results upload isn't
    # bounded by this chart - keep proxy-body-size unlimited rather than
    # tuning it per deployment.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  hosts:
    - host: resonate-worker.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: resonate-worker-tls
      hosts:
        - resonate-worker.example.com

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Off by default: a worker currently has no concurrency cap on how many
# resonate subprocesses it runs at once (see the docs' Operations page), so scaling
# replicas doesn't scale capacity in a controlled way yet.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# resonate-worker keeps each task's scenario file, state (task.json) and
# reports (report.html/report.json/results.jsonl/log.txt) on local disk, under
# WORKSPACE_DIR, with no other durability. Enable this to keep the task list
# and reports across pod restarts; leave it off for disposable/CI use. Without
# it the workspace is lost with the pod.
persistence:
  enabled: false
  size: 10Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

nodeSelector: {}

tolerations: []

affinity: {}
