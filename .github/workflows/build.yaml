name: Build
on:
  push:
    branches: [ main, next ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check (gofmt, vet, test)
        run: make check
      - name: Build
        run: make build
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: jecklgamis/resonate-worker
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
      - name: Extract metadata (tags, labels) for the controller image
        id: meta-controller
        uses: docker/metadata-action@v6
        with:
          images: jecklgamis/resonate-controller
      - name: Build and push controller Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.controller
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-controller.outputs.tags }}
          labels: ${{ steps.meta-controller.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
