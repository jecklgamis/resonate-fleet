name: Release

on:
  push:
    tags:
      - "v*" # e.g. v1.0.0-alpha.1, v1.2.3

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check (gofmt, vet, test)
        run: make check

  build:
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          ldflags="-s -w -X main.version=${{ github.ref_name }}"
          go build -trimpath -ldflags "$ldflags" -o "resonate-worker$ext" ./cmd/resonate-worker
          go build -trimpath -ldflags "$ldflags" -o "resonate-controller$ext" ./cmd/resonate-controller
          go build -trimpath -ldflags "$ldflags" -o "resonatectl$ext" ./cmd/resonatectl

      - name: Package
        id: package
        run: |
          name="resonate-fleet_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir "$name"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv resonate-worker.exe resonate-controller.exe resonatectl.exe "$name/"
          else
            mv resonate-worker resonate-controller resonatectl "$name/"
          fi
          # Bundle the matching resonate binary so the archive runs on its own;
          # keep in step with RESONATE_VERSION in deployment/docker/worker/Dockerfile.
          rv=v1.0.0-alpha.3
          if [ "${{ matrix.goos }}" = "windows" ]; then rext=zip; else rext=tar.gz; fi
          rname="resonate_${rv}_${{ matrix.goos }}_${{ matrix.goarch }}"
          curl -fsSL -o "/tmp/$rname.$rext" "https://github.com/jecklgamis/resonate/releases/download/$rv/$rname.$rext"
          mkdir /tmp/resonate-dist
          if [ "$rext" = zip ]; then unzip -q "/tmp/$rname.$rext" -d /tmp/resonate-dist; else tar -xzf "/tmp/$rname.$rext" -C /tmp/resonate-dist; fi
          rbin=$(find /tmp/resonate-dist -type f \( -name resonate -o -name resonate.exe \) | head -n1)
          test -n "$rbin"
          cp "$rbin" "$name/"
          cp README.md LICENSE "$name/"
          cp -r examples "$name/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "$name.zip" "$name"
            echo "asset=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "asset=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: ${{ steps.package.outputs.asset }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Determine prerelease status
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.prerelease.outputs.value }}
          files: dist/*
          generate_release_notes: true
